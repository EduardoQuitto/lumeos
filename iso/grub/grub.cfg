# GRUB config para Lume OS ISO amd64
set default=0
set timeout=5

set gfxmode=auto
load_video
insmod gfxterm
set gfxpayload=keep

menuentry "Lume OS amd64 — Iniciar (live)" {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper quiet splash plymouth.enable=1 locale=pt_BR
    initrd  /casper/initrd
}

menuentry "Lume OS amd64 — Iniciar (live, modo seguro)" {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper nomodeset quiet splash plymouth.enable=1 locale=pt_BR
    initrd  /casper/initrd
}

menuentry "Lume OS amd64 — Instalar no HD" {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper only-ubiquity quiet splash plymouth.enable=1 locale=pt_BR
    initrd  /casper/initrd
}
