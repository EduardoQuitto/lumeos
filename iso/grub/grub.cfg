# GRUB config para Lume OS ISO amd64/i386
# Configuração para Debian live-boot (não Ubuntu/Casper)
set default=0
set timeout=5

set gfxmode=auto
load_video
insmod gfxterm
set gfxpayload=keep
set locale_dir=/boot/grub/locale
set lang=pt_BR

insmod png
if background_image /boot/grub/background.png ; then
  set color_normal=white/black
  set color_highlight=yellow/black
fi

menuentry "Lume OS - Iniciar (Live)" {
    set gfxpayload=keep
    linux   /live/vmlinuz boot=live quiet splash plymouth.enable=1 locale=pt_BR locales=pt_BR.UTF-8 keyboard-layouts=abnt2
    initrd  /live/initrd.img
}

menuentry "Lume OS - Iniciar (Modo Seguro)" {
    set gfxpayload=keep
    linux   /live/vmlinuz boot=live quiet splash plymouth.enable=1 locale=pt_BR locales=pt_BR.UTF-8 keyboard-layouts=abrt2 nomodeset
    initrd  /live/initrd
}

menuentry "Lume OS - Instalar no HD" {
    set gfxpayload=keep
    linux   /live/vmlinuz boot=live only-ubiquity quiet splash plymouth.enable=1 locale=pt_BR locales=pt_BR.UTF-8 keyboard-layouts=abrt2
    initrd  /live/initrd
}

menuentry "Lume OS - Modo Recuperação" {
    set gfxpayload=keep
    linux   /live/vmlinuz boot=live quiet splash plymouth.enable=1 locale=pt_BR locales=pt_BR.UTF-8 keyboard-layouts=abrt2 single
    initrd  /live/initrd
}

menuentry "Lume OS - Testar Memória (memtest86+)" {
    linux16 /boot/memtest86+.bin
}

menuentry "Lume OS - Desligar" {
    halt
}
