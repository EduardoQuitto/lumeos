name: ci
on: [push, schedule]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps: [uses: actions/checkout@v4, run: cargo fmt --check && cargo clippy -- -D warnings]
  build-smoke:
    runs-on: ubuntu-latest
    strategy: {matrix: {arch: [amd64, i386]}}
    steps:
      - uses: actions/checkout@v4
      - run: podman run --rm -v $PWD:/w debian:12 bash /w/build/live-build/build.sh ${{ matrix.arch }}
      - run: bash tests/qemu/smoke.sh ${{ matrix.arch }}   # boot <30s, idle, screendump
      - uses: actions/upload-artifact@v4
        with: {name: iso-${{ matrix.arch }}, path: out/}