name: ci
on: [push, schedule]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check && cargo clippy -- -D warnings
  build-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, i386]
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências de build
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-system-${{ matrix.arch }} qemu-utils grub-pc-bin grub-efi-amd64 mksquashfs curl wget gnupg2
      - run: podman run --rm -v $PWD:/w debian:12 bash /w/build/live-build/build.sh ${{ matrix.arch }}
      - run: bash tests/qemu/smoke.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.arch }}
          path: out/
