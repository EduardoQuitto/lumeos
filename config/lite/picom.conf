# Lume OS Lite Edition — Picom configuration
# Otimizado para hardware fraco (P4, 1–2 GB RAM)
# Blur leve apenas se GL >= 2.1

backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
vsync = true;
dbe = false;
paint-on-overlay = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-transient = true;
detect-client-leader = true;
detect-circle-corner = true;
use-damage = true;
no-dnd-shadow = true;
no-dock-shadow = false;
no-fading-openclose = true;
shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.3;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g = 'Kupfer'",
  "class_g = 'Screenkey'",
  "class_g = 'synapse'",
  "_NET_WM_WINDOW_TYPE = 'SPOUT'",
];
fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
blur-background = false;
blur-background-frame = false;
blur-method = "dual_kawase";
blur-strength = 5;
