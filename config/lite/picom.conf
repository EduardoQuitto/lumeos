# picom.conf — Compositor leve para Lume OS Lite i386
# Otimizado para hardware fraco (P4, 1-2 GB RAM)

# Backend
backend = "glx";

# GLX backend
glx-no-stencil = true;
glx-copy-from-front = false;
glx-swap-method = "undefined";

# Shadow
shadow = true;
no-dnd-shadow = true;
no-dock-shadow = true;
clear-shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.7;
shadow-red = 0.0;
shadow-green = 0.0;
shadow-blue = 0.0;
shadow-exclude = [
    "n:w:*Compton*",
    "n:w:*Panel*",
    "n:w:*Synapse*",
    "n:w:*Klipper*",
    "n:w:*dockbarx*",
    "n:w:*plank*",
    "n:w:*cairo-dock*",
    "n:w:*yakuake*",
    "n:w:*xfce4-notifyd*",
    "n:w:*xfce4-panel*",
    "class_g = 'Conky'",
    "n:w:*i3lock*",
    "n:w:*plasma_desktop*",
    "n:w:*plasmashell*",
];

# Fading
fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;
no-fading-openclose = true;

# Opacity
opacities = [];
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
alpha-step = 0.03;

# Dim inactive windows
inactive-dim = 0.2;
inactive-dim-fixed = false;

# Blur
blur-background = false;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [];

# Dimming
dim-inactive = 0.0;
dim-fixed = false;

# Scrolling
scroll-capture = true;

# Background color
background-color = "#0e1116";

# Window type settings
wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.85; focus = true; full-shadow = false; };
    dock = { shadow = false; diameter = 0; opacity = 1.0; focus = true; full-shadow = false; };
    dropdown_menu = { shadow = true; fading = true; };
    popup = { shadow = true; fading = true; };
    notification = { shadow = true; fading = true; };
    combo = { shadow = false; diameter = 0; };
    dnd = { shadow = false; opacity = 0.8; };
    popup_menu = { shadow = true; fading = true; };
    splash = { shadow = true; fading = true; };
    override_redirect = { shadow = false; };
};
