# Lume OS Lite Edition — Idle optimization
# Target: idle ≤250 MB RAM
# Arquitetura: i386 (PAE)

[Idle]
MaxMemoryMB = 250
CheckIntervalSec = 10

[Services]
Disabled =
  bluetooth.service,
  cups.service,
  avahi-daemon.service,
  ModemManager.service,
  fwupd.service,
  snapd.service,
  flatpak-system-helper.service,

[Kernel]
ZramEnabled = true
ZramAlgorithm = zstd
HibernationDisabled = true
