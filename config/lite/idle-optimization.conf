# Idle Optimization — Lume OS Lite i386
# Alvo: idle ≤ 250MB em hardware fraco (P4, 1-2 GB RAM)

[Serviços Desabilitados]
bluetooth.service
cups.service
avahi-daemon.service
ModemManager.service
wpa_supplicant.service
systemd-resolved.service
systemd-timesyncd.service
ufw.service
apport.service
cron.service
atd.service

[Serviços Essenciais (mantidos)]
systemd-journald
systemd-logind
systemd-udevd
dbus
NetworkManager
ssh
lightdm

[Configurações Kernel]
vm.swappiness=10
vm.vfs_cache_pressure=50
vm.dirty_ratio=10
vm.dirty_background_ratio=5

[Configurações X11]
DPMS=false
ScreenSaver=false

[Configurações Picom]
backend=glx
shadow=true
blur-background=false
fading=true

[Limites de Memória]
idle_max_mb=250
alert_threshold_mb=230
critical_threshold_mb=245

[Monitoramento]
check_interval_s=30
log_memory_usage=true
