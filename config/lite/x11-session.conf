# Lume OS Lite Edition — Sessão X11 + Picom
# Arquitetura: i386 (PAE)
# Target: P4, 1–2 GB RAM, GPU 2004–2009
# Idle target: ≤250 MB

[Session]
Name=Lume Lite
RequiredComponents=openbox;picom;lxpolkit

[Environment]
XDG_CURRENT_DESKTOP=Lume-Lite
XDG_SESSION_DESKTOP=Lume-Lite
DESKTOP_SESSION=Lume-Lite
