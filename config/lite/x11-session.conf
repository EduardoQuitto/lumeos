# X11 Session Config — Lume OS Lite i386
# Configuração do ambiente X11 para edição Lite

[Desktop Entry]
Name=Lume OS Lite
Comment=Lume OS Lite Edition (X11 + picom)
Exec=/usr/bin/openbox-session
TryExec=/usr/bin/openbox
Icon=lume-lite
Type=Application

[Window Manager]
SessionManager=openbox-session
WindowManager=openbox
Compositor=picom

[AutoStart]
picom --config /etc/xdg/picom.conf &
lxpanel &
pcmanfm --desktop &
nm-applet &
blueman-applet &

[Environment]
XDG_CURRENT_DESKTOP=Lume-Lite
XDG_SESSION_DESKTOP=Lume-Lite
GTK_THEME=Adwaita
QT_QPA_PLATFORMTHEME=gtk2
LANG=pt_BR.UTF-8
LC_ALL=pt_BR.UTF-8
