# Lume OS — Performance Budgets
# Fase 25: Passe Performance
# Metas nos 3 tiers: Prime / Core / Lite

[budgets.boot]
prime_ms = 20000   # <20s VM Prime
core_ms = 30000    # <30s Core
lite_ms = 30000    # <30s Lite

[budgets.idle]
prime_mb = 450     # ≤450 MB Prime
core_mb = 350      # ≤350 MB Core
lite_mb = 250      # ≤250 MB Lite

[budgets.flyout]
max_ms = 150       # ≤150 ms

[budgets.iso]
amd64_bytes = 1400000000   # ≤1,4 GB amd64
i386_bytes = 900000000     # ≤900 MB i386

[budgets.animation]
prime_fps = 60   # 60 fps Prime
core_fps = 30    # fades Core
lite_fps = 30    # Lite digno
