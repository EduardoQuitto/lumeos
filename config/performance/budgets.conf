# Lume OS - Orçamentos de Performance
# Requisitos fase 25:
#   - Boot: <20s Prime, <30s Core/Lite
#   - Idle: ≤450MB Prime, ≤350MB Core, ≤250MB Lite
#   - Flyout: ≤150ms
#   - ISO: ≤1,4GB amd64, ≤900MB i386

[budgets]
# Tempos de boot (ms)
boot_prime_ms = 20000
boot_core_ms = 30000
boot_lite_ms = 30000

# Idle (MB)
idle_prime_mb = 450
idle_core_mb = 350
idle_lite_mb = 250

# Flyout (ms)
flyout_ms = 150

# ISO (bytes)
iso_amd64_bytes = 1400000000
iso_i386_bytes = 900000000

[metricas]
boot = true
idle = true
flyout = true
iso = true

[alertas]
enable = true
notify_on_violation = true
