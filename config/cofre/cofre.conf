# Modo Cofre — Lume OS
# Requisitos fase 22:
#   - microVM descartavel
#   - abre app de risco e destroi sem residuo

[cofre]
# Configuracao da microVM
memoria_mb = 512
vcpus = 1
tempo_max_execucao_s = 300

# Segurança
isolamento = "microVM"
destruicao_automatica = true
limpar_residuos = true

# Diretorios
diretorio_cofre = "/var/lib/lume/cofre"
diretorio_seals = "/var/lib/lume/seals"
diretorio_base = "/usr/share/lume/base"

# Aplicativos permitidos no cofre
apps_permitidos = [
    "navegador-risco",
    "cliente-p2p",
    "jogo-nao-verificado",
    "utilitario-desconhecido"
]

# Logs
log_nivel = "info"
log_destruicao = true
