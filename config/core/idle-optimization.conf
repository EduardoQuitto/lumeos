# Idle Optimization — Lume OS Core amd64
# Alvo: idle ≤ 350MB em hardware médio (amd64, <4 GB RAM)

[Serviços Desabilitados]
bluetooth.service
cups.service
avahi-daemon.service
ModemManager.service
wpa_supplicant.service
systemd-resolved.service
systemd-timesyncd.service
ufw.service
apport.service
cron.service
atd.service

[Serviços Essenciais (mantidos)]
systemd-journald
systemd-logind
systemd-udevd
dbus
NetworkManager
ssh
lightdm

[Configurações Kernel]
vm.swappiness=10
vm.vfs_cache_pressure=50
vm.dirty_ratio=10
vm.dirty_background_ratio=5

[Configurações Wayland]
DPMS=false
ScreenSaver=false

[Configurações labwc]
shadow_camadas=2
shadow_opacity=0.3

[Limites de Memória]
idle_max_mb=350
alert_threshold_mb=330
critical_threshold_mb=345

[Monitoramento]
check_interval_s=30
log_memory_usage=true
