# Lume OS Core Edition — Idle optimization
# Target: idle ≤350 MB RAM
# Arquitetura: amd64
# Materiais: Névoa + Sólido + sombras

[Idle]
MaxMemoryMB = 350
CheckIntervalSec = 10

[Services]
Disabled =
  bluetooth.service,
  cups.service,
  avahi-daemon.service,
  ModemManager.service,
  fwupd.service,
  snapd.service,
  flatpak-system-helper.service,

[Kernel]
ZramEnabled = true
ZramAlgorithm = zstd
HibernationDisabled = true

[Materials]
Enabled =
  Névoa,
  Sólido,
  Sombras
