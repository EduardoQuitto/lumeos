<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8A5C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F65A8E;stop-opacity:1" />
    </linearGradient>
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Arcos orbitais (fundo sutil) -->
  <circle cx="120" cy="120" r="78" fill="none" stroke="#9D7BFA" stroke-width="3" opacity="0.15" />
  <circle cx="120" cy="120" r="102" fill="none" stroke="#3E8EF7" stroke-width="2" opacity="0.10" />
  <circle cx="120" cy="120" r="118" fill="none" stroke="#45C8F5" stroke-width="1.5" opacity="0.08" />

  <!-- Símbolo L + pétala -->
  <path d="M 72 168 L 72 96 L 108 96 L 108 144 L 144 144 L 144 168 Z" fill="url(#grad-light)" />
  <path d="M 108 96 Q 132 72 156 96 Q 132 120 108 144" fill="none" stroke="#F65A8E" stroke-width="8" stroke-linecap="round" />
  
  <!-- Círculo central (núcleo da pétala) -->
  <circle cx="120" cy="120" r="14" fill="#F7F9FC" />

  <!-- Glow só para splash/marketing (conforme PRD) -->
  <g filter="url(#glow-light)" opacity="0.6">
    <circle cx="120" cy="120" r="90" fill="url(#grad-light)" />
  </g>
</svg>
