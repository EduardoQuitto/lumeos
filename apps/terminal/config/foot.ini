# foot — terminal emulator para Lume OS (Wayland)
# Configuração base para o terminal Lume

[font]
size = 13
family = JetBrains Mono

[colors]
# Paleta Lume — tinta/papel
background = 0e1116
foreground = f7f9fc
selection_background = 3e8ef7
selection_foreground = f7f9fc
cursor = f7f9fc
cursor_foreground = 0e1116

# Cores ANSI (base na paleta Lume)
color0 = 1e293b   # preto
color1 = c42b1c   # vermelho (perigo)
color2 = 4ade80   # verde (sucesso)
color3 = f65a8e   # amarelo/rosa
color4 = 3e8ef7   # azul (marca)
color5 = 9d7bfa   # magenta
color6 = 45c8f5   # ciano
color7 = f7f9fc   # branco
color8 = 334155   # preto brilhante
color9 = c42b1c   # vermelho brilhante
color10 = 4ade80  # verde brilhante
color11 = f65a8e  # rosa brilhante
color12 = 3e8ef7  # azul brilhante
color13 = 9d7bfa  # magenta brilhante
color14 = 45c8f5  # ciano brilhante
color15 = f7f9fc  # branco brilhante

[spell_checking]
enable = false

[links]
enable = true

[selection]
enable = true

[bell]
enable = false

[scrollback]
lines = 10000

[tabs]
enable = true
mode = title

[mouse]
enable = true
hide_when_typing = true

[urls]
enable = true
launcher = xdg-open

[cursor_blink]
enable = false
timeout = 0
interval = 650

[csi_u]
enable = true

[initial_window_size]
cols = 100
rows = 30

[border_color]
color = 1e293b

[border_size]
width = 1

[alpha]
background = 0.95

[click_on_url]
modifiers = none
action = open

[inactive_alpha]
background = 1.0

[search_wrap]
enable = true

[urgent_on_bell]
enable = false

[clickable_url_bg_color]
color = 3e8ef7

[clickable_url_fg_color]
color = f7f9fc

[command]
command = /bin/bash
arguments = --login

[env]
TERM = foot
SHELL = /bin/bash

[advanced]
debug_level = none
log_file = -
max_notifications = 5
vt_id = 0

[keys]
# Atalhos principais
key = ctrl+shift+t, action = new_tab
key = ctrl+shift+w, action = close_tab
key = ctrl+shift+page_up, action = previous_tab
key = ctrl+shift+page_down, action = next_tab
key = ctrl+shift+c, action = copy_primary
key = ctrl+shift+v, action = paste_primary
key = ctrl+shift+c, modifiers = none, action = copy_selection
key = ctrl+shift+v, modifiers = none, action = paste_clipboard
key = ctrl+shift+q, action = quit
key = ctrl+shift+n, action = new_window
key = ctrl+shift+s, action = toggle_sticky_keys
key = ctrl+shift+l, action = toggle_link_mode
key = ctrl+shift+f, action = search
key = ctrl+shift+minus, action = decrease_font_size
key = ctrl+shift+plus, action = increase_font_size
key = ctrl+shift+0, action = reset_font_size
key = ctrl+shift+l, action = clear_selection
key = ctrl+shift+x, action = toggle_maximize
key = ctrl+shift+f11, action = toggle_fullscreen

[mouse_bindings]
# Middle click paste
button = middle, action = paste_primary

[search]
regex = false
case_sensitive = false

[notification]
urgency = normal
command = notify-send "%t" "%c"
