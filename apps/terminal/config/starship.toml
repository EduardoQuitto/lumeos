# starship — prompt para Lume OS Terminal
# Configuração baseada na paleta Lume

# Formato geral
format = """
$all
"""

# Desabilitar linha em branco no início
add_newline = false

# Caractere de prompt
[character]
success_symbol = "[➜](bold #3e8ef7)"
error_symbol = "[✗](bold #c42b1c)"
vicmd_symbol = "[➤](bold #9d7bfa)"
format = "$symbol "

# Tempo de execução
[duration]
format = "[⏱ $duration](bold #f65a8e) "
show_milliseconds = false
min_time = 500

# Usuário
[username]
format = "[👤 $user](bold #45c8f5)"
show_always = true
style_user = "bold #45c8f5"
style_root = "bold #c42b1c"
disabled = false

# Nome do host
[hostname]
format = "[🖥 $hostname](bold #9d7bfa)"
ssh_only = false
disabled = false

# Diretório atual
[directory]
format = "[📁 $path](bold #f7f9fc)"
style = "bold #f7f9fc"
truncation_length = 4
truncate_to_repo = false

# Git
[git_branch]
symbol = " "
format = "[$symbol$branch](bold #45c8f5)"
style = "bold #45c8f5"
truncation_length = 4
truncate_to_repo = false

[git_status]
format = '([$all_status$ahead_behind](bold #f65a8e))'
style = "bold #f65a8e"
conflicted = "="
ahead = "↑$count"
behind = "↓$count"
diverged = "↕$count"
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
readonly = "🔒"

# Terraform
[terraform]
format = "[☁️ $workspace](bold #9d7bfa)"
style = "bold #9d7bfa"
disabled = false

# AWS
[aws]
format = "[☁️ $profile](bold #f65a8e)"
style = "bold #f65a8e"
disabled = false

