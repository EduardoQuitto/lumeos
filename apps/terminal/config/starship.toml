disabled = false

# Kubernetes
[kubernetes]
format = '[☸ $context on $namespace](bold #3e8ef7)'
style = "bold #3e8ef7"
format_prefix = "["
format_suffix = "]"
disabled = false

# Docker Context
[docker_context]
format = "[🐳 $context](bold #45c8f5)"
style = "bold #45c8f5"
disabled = false

